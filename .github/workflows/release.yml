# Publication d'une release GitHub à chaque tag « vX.Y.Z » : compendiums fabriqués, module empaqueté (outils/empaqueter-module.mjs),
# monde empaqueté si le script « empaqueter-monde » existe dans package.json, puis release avec module.json, lakour-warcraft.zip,
# world.json et l'archive du monde. Les manifestes publiés portent la version du tag (vérifiée contre module.json).
# Prérequis : le sous-module modules/lakour-mj-ia doit être lisible par le jeton du workflow (dépôt public, ou PAT dans
# le secret SOUS_MODULE_TOKEN si le moteur reste privé).
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et le sous-module
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SOUS_MODULE_TOKEN || github.token }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Version du tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag « $GITHUB_REF_NAME » : attendu vX.Y.Z" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dépendances
        run: npm ci

      - name: Fabriquer les compendiums
        run: npm run fabriquer-warcraft

      - name: Essais
        run: npm run essais

      - name: Empaqueter le module
        run: node outils/empaqueter-module.mjs --version "${{ steps.version.outputs.version }}" --verifier-version --depot "https://github.com/${{ github.repository }}"

      - name: Empaqueter le monde (si le script existe)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPOT: https://github.com/${{ github.repository }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['empaqueter-monde'] ? 0 : 1)"; then
            npm run empaqueter-monde
          else
            echo "Pas de script empaqueter-monde : pas d'archive de monde pour cette release."
          fi

      - name: Vérifier les fichiers à publier
        run: |
          ls -l dist/
          test -s dist/module.json
          test -s dist/lakour-warcraft.zip
          node -e "const m=require('./dist/module.json'); if (m.version!=='${{ steps.version.outputs.version }}') { console.error('version du manifeste publié :', m.version); process.exit(1) }"

      - name: Notes de version (section du CHANGELOG)
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / { if (dans) exit; if (index($0, "## " v) == 1) { dans = 1; next } }
            dans { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "Release $VERSION (pas de section « ## $VERSION » dans CHANGELOG.md)." > dist/notes.md
          fi
          cat dist/notes.md

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: La Kour Warcraft ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          fail_on_unmatched_files: false
          files: |
            dist/module.json
            dist/lakour-warcraft.zip
            dist/world.json
            dist/*.zip
