# Publication d'une release GitHub à chaque tag « vX.Y.Z » : compendiums fabriqués (français, puis anglais : module
# lakour-warcraft-en engendré à partir des mêmes sources et des dictionnaires contenu/en/), modules empaquetés
# (outils/empaqueter-module.mjs), mondes vierges empaquetés (français puis anglais) si le script « empaqueter-monde » existe dans
# package.json et recopiés de monde/dist dans dist/, puis release avec module.json, lakour-warcraft.zip, lakour-warcraft-en.json,
# lakour-warcraft-en.zip, world.json, la-kour-warcraft.zip, world-en.json et la-kour-warcraft-en.zip.
# Les manifestes publiés portent la version du tag (vérifiée contre module.json). Adresses stables données aux joueurs :
#   https://github.com/Hogun974/lakour-warcraft/releases/latest/download/module.json               (français)
#   https://github.com/Hogun974/lakour-warcraft/releases/latest/download/lakour-warcraft-en.json   (anglais)
# Prérequis : le sous-module modules/lakour-mj-ia doit être lisible par le jeton du workflow (dépôt public, ou PAT dans
# le secret SOUS_MODULE_TOKEN si le moteur reste privé).
name: Publication

on:
  push:
    tags: ["v*"]
  # Release à blanc, à la main (Actions › Publication › Run workflow, sur principale ou une autre branche) :
  # tout est fabriqué et vérifié comme pour une vraie release, avec la version du manifeste (comme si l'étiquette
  # v<version> était posée) ; le contenu de dist/ est déposé en artefact du workflow, rien n'est publié.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et le sous-module
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SOUS_MODULE_TOKEN || github.token }}

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Version du tag
        id: version
        run: |
          # Sur une étiquette, sa version (vérifiée plus bas contre module.json). Release à blanc hors étiquette : la version
          # de modules/lakour-warcraft/module.json, comme si l'étiquette v<version> était posée (aucun échec).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./modules/lakour-warcraft/module.json').version")
            echo "Release à blanc sur « $GITHUB_REF_NAME » (pas d'étiquette) : empaquetage comme v$VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag « $GITHUB_REF_NAME » : attendu vX.Y.Z" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dépendances
        run: npm ci

      - name: Fabriquer les compendiums
        run: npm run fabriquer-warcraft

      - name: Module anglais lakour-warcraft-en (modules/lakour-warcraft-en/, hors git)
        run: npm run fabriquer-warcraft-en

      - name: Essais
        run: npm run essais

      - name: Empaqueter le module
        run: node outils/empaqueter-module.mjs --version "${{ steps.version.outputs.version }}" --verifier-version --depot "https://github.com/${{ github.repository }}"

      - name: Empaqueter le module anglais (lakour-warcraft-en.zip, manifeste lakour-warcraft-en.json)
        run: node outils/empaqueter-module.mjs --module lakour-warcraft-en --version "${{ steps.version.outputs.version }}" --verifier-version --depot "https://github.com/${{ github.repository }}"

      - name: Empaqueter les mondes vierges, français puis anglais (si le script existe), et les recopier dans dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPOT: https://github.com/${{ github.repository }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['empaqueter-monde'] ? 0 : 1)"; then
            npm run empaqueter-monde
            npm run empaqueter-monde -- --langue en
            cp monde/dist/world.json dist/world.json
            cp monde/dist/la-kour-warcraft.zip dist/la-kour-warcraft.zip
            cp monde/dist/world-en.json dist/world-en.json
            cp monde/dist/la-kour-warcraft-en.zip dist/la-kour-warcraft-en.zip
          else
            echo "Pas de script empaqueter-monde : pas d'archive de monde pour cette release."
          fi

      - name: Vérifier les fichiers à publier
        run: |
          ls -l dist/
          test -s dist/module.json
          test -s dist/lakour-warcraft.zip
          test -s dist/lakour-warcraft-en.json
          test -s dist/lakour-warcraft-en.zip
          if [ -s dist/world.json ]; then test -s dist/la-kour-warcraft.zip && test -s dist/world-en.json && test -s dist/la-kour-warcraft-en.zip; fi
          node -e "const m=require('./dist/module.json'); if (m.version!=='${{ steps.version.outputs.version }}') { console.error('version du manifeste publié :', m.version); process.exit(1) }"

      - name: Notes de version (section du CHANGELOG)
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / { if (dans) exit; if (index($0, "## " v) == 1) { dans = 1; next } }
            dans { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "Release $VERSION (pas de section « ## $VERSION » dans CHANGELOG.md)." > dist/notes.md
          fi
          cat dist/notes.md

      - name: Release GitHub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: La Kour Warcraft ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          # dist/ ne contient que ce qui est publié (plus notes.md) : deux motifs, aucun fichier listé deux fois (l'action
          # ne dédoublonne pas : lakour-warcraft.zip, nommé ET couvert par dist/*.zip, était envoyé deux fois).
          fail_on_unmatched_files: true
          files: |
            dist/*.json
            dist/*.zip

      # Release à blanc (lancement à la main) : pas de release GitHub, dist/ est déposé en artefact à télécharger.
      - name: Release à blanc (dist/ déposé en artefact, rien n'est publié)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-a-blanc-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
